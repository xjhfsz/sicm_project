<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICM - Controle de Portaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">🏢 SICM</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-light me-3">Olá, {{ user.first_name }}</span>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm me-2">Meu Painel</a>
                    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Sair</a>
                {% else %}
                    <a href="{% url 'portaria' %}" class="btn btn-warning btn-sm me-2">Acesso Portaria</a>
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Login Morador</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
